<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Clinical AI failure mapping from noisy records to a coherent note</title>
  <desc id="desc">A three stage diagram showing a noisy record packet, a clinician structured truth state, and a generated note scored for supported and unsupported content.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#12202b" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="960" height="620" rx="36" fill="#eef3f4"/>
  <circle cx="902" cy="58" r="158" fill="#27647a" opacity=".12"/>
  <circle cx="32" cy="610" r="170" fill="#b95f35" opacity=".11"/>
  <text x="54" y="58" fill="#8d3f1f" font-family="Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3">CLINICAL AI RED TEAMING</text>
  <text x="54" y="102" fill="#12202b" font-family="Georgia, serif" font-size="36">Trace every sentence back to evidence.</text>

  <g transform="translate(52 150)" filter="url(#softShadow)">
    <rect width="242" height="340" rx="22" fill="#fbfaf6"/>
    <text x="22" y="36" fill="#12202b" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.6">NOISY RECORD PACKET</text>
    <g transform="translate(22 62)">
      <rect width="198" height="48" rx="10" fill="#f0ddd4"/>
      <text x="14" y="20" fill="#8d3f1f" font-family="Arial, sans-serif" font-size="10" font-weight="800">2019 DIAGNOSIS LIST</text>
      <text x="14" y="35" fill="#755a4e" font-family="Arial, sans-serif" font-size="9">schizophrenia · bipolar · depression</text>
    </g>
    <g transform="translate(22 120)">
      <rect width="198" height="48" rx="10" fill="#e5eef0"/>
      <text x="14" y="20" fill="#27647a" font-family="Arial, sans-serif" font-size="10" font-weight="800">2026 CURRENT MAR</text>
      <text x="14" y="35" fill="#52636d" font-family="Arial, sans-serif" font-size="9">three active medications</text>
    </g>
    <g transform="translate(22 178)">
      <rect width="198" height="48" rx="10" fill="#edf1ea"/>
      <text x="14" y="20" fill="#50624e" font-family="Arial, sans-serif" font-size="10" font-weight="800">GROUP HOME COLLATERAL</text>
      <text x="14" y="35" fill="#52636d" font-family="Arial, sans-serif" font-size="9">conflicts with patient report</text>
    </g>
    <g transform="translate(22 236)">
      <rect width="198" height="48" rx="10" fill="#f4ebcf"/>
      <text x="14" y="20" fill="#756329" font-family="Arial, sans-serif" font-size="10" font-weight="800">OLD MEDICATION LIST</text>
      <text x="14" y="35" fill="#756b49" font-family="Arial, sans-serif" font-size="9">duplicates and discontinued entries</text>
    </g>
    <g transform="translate(22 294)">
      <rect width="198" height="24" rx="12" fill="#12202b"/>
      <text x="99" y="16" text-anchor="middle" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="1">CHART NOISE</text>
    </g>
  </g>

  <g transform="translate(359 150)" filter="url(#softShadow)">
    <rect width="242" height="340" rx="22" fill="#12202b"/>
    <text x="22" y="36" fill="#dd9a72" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.6">CLINICIAN TRUTH STATE</text>
    <g transform="translate(22 62)">
      <rect width="198" height="58" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="18" cy="20" r="6" fill="#6f826d"/>
      <text x="34" y="23" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="10" font-weight="800">CURRENT AND SUPPORTED</text>
      <text x="18" y="44" fill="#bcc8cd" font-family="Arial, sans-serif" font-size="9">active meds · current symptoms</text>
    </g>
    <g transform="translate(22 132)">
      <rect width="198" height="58" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="18" cy="20" r="6" fill="#27647a"/>
      <text x="34" y="23" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="10" font-weight="800">HISTORICAL AND RELEVANT</text>
      <text x="18" y="44" fill="#bcc8cd" font-family="Arial, sans-serif" font-size="9">prior episodes · old treatment</text>
    </g>
    <g transform="translate(22 202)">
      <rect width="198" height="58" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="18" cy="20" r="6" fill="#b95f35"/>
      <text x="34" y="23" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="10" font-weight="800">CONTRADICTORY OR STALE</text>
      <text x="18" y="44" fill="#bcc8cd" font-family="Arial, sans-serif" font-size="9">legacy diagnoses · copied errors</text>
    </g>
    <g transform="translate(22 272)">
      <rect width="198" height="46" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="18" cy="18" r="6" fill="#d5bd62"/>
      <text x="34" y="21" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="10" font-weight="800">UNKNOWN</text>
      <text x="18" y="37" fill="#bcc8cd" font-family="Arial, sans-serif" font-size="9">requires clarification</text>
    </g>
  </g>

  <g transform="translate(666 150)" filter="url(#softShadow)">
    <rect width="242" height="340" rx="22" fill="#fbfaf6"/>
    <text x="22" y="36" fill="#12202b" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.6">GENERATED NOTE</text>
    <g transform="translate(22 62)" font-family="Arial, sans-serif">
      <rect width="198" height="36" rx="8" fill="#e7f0e5"/>
      <rect y="46" width="198" height="36" rx="8" fill="#e7f0e5"/>
      <rect y="92" width="198" height="36" rx="8" fill="#f4ebcf"/>
      <rect y="138" width="198" height="36" rx="8" fill="#f0ddd4"/>
      <rect y="184" width="198" height="36" rx="8" fill="#e7f0e5"/>
      <rect y="230" width="198" height="36" rx="8" fill="#f0ddd4"/>
      <g stroke="#879399" stroke-width="5" stroke-linecap="round">
        <path d="M14 13h144"/><path d="M14 25h112"/>
        <path d="M14 59h160"/><path d="M14 71h128"/>
        <path d="M14 105h138"/><path d="M14 117h166"/>
        <path d="M14 151h150"/><path d="M14 163h120"/>
        <path d="M14 197h170"/><path d="M14 209h132"/>
        <path d="M14 243h146"/><path d="M14 255h168"/>
      </g>
      <g font-size="8" font-weight="900" text-anchor="middle">
        <rect x="164" y="8" width="26" height="20" rx="10" fill="#6f826d"/>
        <text x="177" y="21" fill="#fff">OK</text>
        <rect x="156" y="100" width="34" height="20" rx="10" fill="#c4a64a"/>
        <text x="173" y="113" fill="#fff">ASK</text>
        <rect x="158" y="146" width="32" height="20" rx="10" fill="#b95f35"/>
        <text x="174" y="159" fill="#fff">ERR</text>
        <rect x="158" y="238" width="32" height="20" rx="10" fill="#8d3f1f"/>
        <text x="174" y="251" fill="#fff">RISK</text>
      </g>
    </g>
    <text x="121" y="318" text-anchor="middle" fill="#52636d" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1">SENTENCE LEVEL TRACEABILITY</text>
  </g>

  <g fill="none" stroke="#12202b" stroke-opacity=".42" stroke-width="3">
    <path d="M310 320h32"/>
    <path d="m337 310 12 10-12 10"/>
    <path d="M617 320h32"/>
    <path d="m644 310 12 10-12 10"/>
  </g>

  <g transform="translate(52 542)" font-family="Arial, sans-serif">
    <rect width="856" height="42" rx="21" fill="#12202b"/>
    <text x="25" y="27" fill="#f5f1e8" font-size="10" font-weight="900" letter-spacing="1.4">OUTPUT:</text>
    <text x="92" y="27" fill="#c8d1d5" font-size="10">failure severity · source evidence · root cause · remediation · retest criteria</text>
  </g>
</svg>
